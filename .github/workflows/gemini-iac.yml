name: "Gemini AI → IaC PR"

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate-iac:
    if: contains(join(github.event.issue.labels.*.name, ','), 'generate-iac')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="iac/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Generate IaC using Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO: ${{ github.repository }}
        run: python tools/gemini_iac_generator.py

      - name: Commit and push
        run: |
          git add infra/
          git commit -m "feat(iac): AI-generated from issue #${{ github.event.issue.number }}" || echo "Nothing to commit"
          git push origin "$BRANCH"

      - name: Create PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            -B master \
            -H "$BRANCH" \
            --title "IaC: AI-generated from Issue #${{ github.event.issue.number }}" \
            --body "🤖 Terraform code generated by **Google Gemini AI** from Issue #${{ github.event.issue.number }}. Please review and merge."

      - name: Comment on issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "✅ **AI-generated Terraform code** created and PR opened automatically! Powered by Google Gemini."
